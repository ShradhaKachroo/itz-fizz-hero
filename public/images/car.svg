<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" fill="none" class="car-svg">
  <defs>
    <!-- Chassis gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="30%" stop-color="#141c2b"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#07111e" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tailGlow" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ff0033" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Underglow Ground Shadow -->
  <ellipse cx="260" cy="110" rx="230" ry="75" fill="#00f0ff" opacity="0.18" filter="url(#glowFilter)"/>
  <ellipse cx="250" cy="110" rx="200" ry="60" fill="#000000" opacity="0.65" filter="url(#glowFilter)"/>

  <!-- Front Volumetric Headlight Beams projecting forward (right side) -->
  <path d="M480 62 L520 20 L520 80 L480 72 Z" fill="url(#headlightBeam)" opacity="0.75" />
  <path d="M480 158 L520 140 L520 200 L480 148 Z" fill="url(#headlightBeam)" opacity="0.75" />

  <!-- Rear Exhaust Heat Glow (left side) -->
  <path d="M50 85 L10 75 L10 145 L50 135 Z" fill="url(#tailGlow)" opacity="0.65" />

  <!-- Wheels / Wide Performance Tires with Brake Calipers -->
  <!-- Rear Left Tire -->
  <rect x="85" y="16" width="75" height="26" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <line x1="95" y1="29" x2="150" y2="29" stroke="#334155" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="110" y="22" width="22" height="6" rx="2" fill="#00F0FF"/>

  <!-- Rear Right Tire -->
  <rect x="85" y="178" width="75" height="26" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <line x1="95" y1="191" x2="150" y2="191" stroke="#334155" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="110" y="192" width="22" height="6" rx="2" fill="#00F0FF"/>

  <!-- Front Left Tire -->
  <rect x="365" y="18" width="72" height="24" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <line x1="375" y1="30" x2="425" y2="30" stroke="#334155" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="388" y="24" width="20" height="6" rx="2" fill="#00F0FF"/>

  <!-- Front Right Tire -->
  <rect x="365" y="178" width="72" height="24" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <line x1="375" y1="190" x2="425" y2="190" stroke="#334155" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="388" y="190" width="20" height="6" rx="2" fill="#00F0FF"/>

  <!-- MAIN CHASSIS BODY -->
  <!-- Aerodynamic Silhouette -->
  <path d="M 55 110
           C 52 92, 60 70, 85 58
           C 115 44, 150 48, 195 46
           C 250 44, 305 46, 360 48
           C 405 50, 445 60, 475 80
           C 495 94, 500 102, 500 110
           C 500 118, 495 126, 475 140
           C 445 160, 405 170, 360 172
           C 305 174, 250 176, 195 174
           C 150 172, 115 176, 85 162
           C 60 150, 52 128, 55 110 Z"
        fill="url(#bodyGrad)"
        stroke="#334155"
        stroke-width="1.8"
        filter="url(#softShadow)"/>

  <!-- Carbon fiber side sills & aerodynamic strakes -->
  <path d="M 175 44 C 230 46, 310 46, 365 47 L 360 52 C 310 50, 230 50, 178 48 Z" fill="#020617" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 175 176 C 230 174, 310 174, 365 173 L 360 168 C 310 170, 230 170, 178 172 Z" fill="#020617" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Side mirrors -->
  <path d="M 320 38 L 338 24 C 342 22, 348 24, 346 29 L 332 44 Z" fill="#090d16" stroke="#00F0FF" stroke-width="1.2"/>
  <path d="M 320 182 L 338 196 C 342 198, 348 196, 346 191 L 332 176 Z" fill="#090d16" stroke="#00F0FF" stroke-width="1.2"/>

  <!-- REAR DIFFUSER & ACTIVE AERO SPOILER -->
  <path d="M 42 78 C 50 78, 65 80, 68 85 L 68 135 C 65 140, 50 142, 42 142 C 38 130, 38 90, 42 78 Z" fill="#050811" stroke="#475569" stroke-width="1.5"/>
  <line x1="38" y1="92" x2="65" y2="92" stroke="#ff0055" stroke-width="2.5" opacity="0.9"/>
  <line x1="38" y1="128" x2="65" y2="128" stroke="#ff0055" stroke-width="2.5" opacity="0.9"/>
  <!-- Central neon third brake light -->
  <line x1="45" y1="102" x2="45" y2="118" stroke="#ff3366" stroke-width="3" filter="url(#glowFilter)"/>

  <!-- ENGINE BAY / REAR DECK LOUVERS -->
  <g opacity="0.8">
    <line x1="110" y1="84" x2="110" y2="136" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="130" y1="80" x2="130" y2="140" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="148" y1="78" x2="148" y2="142" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="166" y1="76" x2="166" y2="144" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="184" y1="76" x2="184" y2="144" stroke="#1e293b" stroke-width="2.5"/>
  </g>

  <!-- COCKPIT / GREENHOUSE CANOPY (TINTED REFLECTIVE GLASS) -->
  <path d="M 205 82
           C 200 82, 198 100, 198 110
           C 198 120, 200 138, 205 138
           C 225 143, 275 146, 325 142
           C 365 138, 385 125, 388 110
           C 385 95, 365 82, 325 78
           C 275 74, 225 77, 205 82 Z"
        fill="url(#glassGrad)"
        stroke="#38bdf8"
        stroke-opacity="0.6"
        stroke-width="1.5"/>

  <!-- Cockpit glass inner specular highlight reflection -->
  <path d="M 215 88 C 240 85, 290 85, 340 92 C 300 90, 250 90, 220 95 Z" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="280" cy="110" rx="35" ry="14" fill="#00F0FF" opacity="0.08" filter="url(#glowFilter)"/>

  <!-- FRONT HOOD CONTOURS & NOSE CONE -->
  <path d="M 388 110 C 420 102, 455 104, 485 110 C 455 116, 420 118, 388 110 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M 410 75 C 445 78, 470 90, 485 102 C 465 92, 435 84, 405 82 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 410 145 C 445 142, 470 130, 485 118 C 465 128, 435 136, 405 138 Z" fill="#0f172a" opacity="0.6"/>

  <!-- DUAL LED HEADLIGHTS (CRYSTAL CYAN & AMBER ACCENT) -->
  <path d="M 465 68 C 480 75, 485 82, 478 86 C 470 82, 460 76, 465 68 Z" fill="#00F0FF" filter="url(#glowFilter)"/>
  <path d="M 465 68 C 480 75, 485 82, 478 86 C 470 82, 460 76, 465 68 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="474" cy="78" r="3.5" fill="#ffffff" filter="url(#glowFilter)"/>

  <path d="M 465 152 C 480 145, 485 138, 478 134 C 470 138, 460 144, 465 152 Z" fill="#00F0FF" filter="url(#glowFilter)"/>
  <path d="M 465 152 C 480 145, 485 138, 478 134 C 470 138, 460 144, 465 152 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="474" cy="142" r="3.5" fill="#ffffff" filter="url(#glowFilter)"/>

  <!-- Front Aero Splitter / Neon Edge Strip -->
  <path d="M 480 82 C 496 95, 498 105, 498 110 C 498 115, 496 125, 480 138" stroke="url(#accentCyan)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowFilter)"/>

  <!-- Subtle Centerline Laser Stripe -->
  <line x1="90" y1="110" x2="480" y2="110" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="16 8" opacity="0.4"/>
</svg>
